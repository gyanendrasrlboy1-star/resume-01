<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="art-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="art-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="art-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="16" fill="url(#bg-grad-4)"/>

  <!-- Creative Workspace Layout -->
  <!-- Top Title Banner -->
  <g transform="translate(40, 30)">
    <text x="0" y="24" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="20">BRAND IDENTITY &amp; VISUALS</text>
    <text x="0" y="44" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="11">Logos, Typography Pairing, Layouts &amp; Color Palettes</text>
  </g>

  <!-- Left: Logo Mark Showcase -->
  <g transform="translate(40, 95)">
    <rect width="240" height="235" rx="14" fill="#18181b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- Central Geometric Logo Art -->
    <circle cx="120" cy="95" r="50" fill="url(#art-grad-1)" opacity="0.9"/>
    <path d="M 95 120 L 120 70 L 145 120 Z" fill="#ffffff" opacity="0.9"/>
    <circle cx="120" cy="100" r="14" fill="#18181b"/>
    
    <text x="120" y="172" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="14" text-anchor="middle">NEXUS BRANDING</text>
    <text x="120" y="190" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Minimalist Identity System</text>

    <!-- Logo Variation Chips -->
    <rect x="35" y="202" width="22" height="22" rx="6" fill="#fb923c"/>
    <rect x="67" y="202" width="22" height="22" rx="6" fill="#ec4899"/>
    <rect x="99" y="202" width="22" height="22" rx="6" fill="#8b5cf6"/>
    <rect x="131" y="202" width="22" height="22" rx="6" fill="#3b82f6"/>
    <rect x="163" y="202" width="22" height="22" rx="6" fill="#10b981"/>
  </g>

  <!-- Right: Color Palette & Typography Card -->
  <g transform="translate(305, 95)">
    <!-- Palette Card -->
    <rect width="255" height="110" rx="14" fill="#18181b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <text x="18" y="24" fill="#e4e4e7" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11">HARMONIOUS PALETTE</text>
    
    <g transform="translate(18, 38)">
      <rect x="0" width="48" height="52" rx="8" fill="#6366f1"/>
      <rect x="54" width="48" height="52" rx="8" fill="#ec4899"/>
      <rect x="108" width="48" height="52" rx="8" fill="#06b6d4"/>
      <rect x="162" width="48" height="52" rx="8" fill="#10b981"/>
    </g>

    <!-- Social Poster Mockup -->
    <g transform="translate(0, 125)">
      <rect width="255" height="110" rx="14" fill="#18181b" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
      <rect x="14" y="14" width="70" height="82" rx="8" fill="url(#art-grad-3)"/>
      <circle cx="49" cy="45" r="16" fill="#ffffff" opacity="0.3"/>
      
      <text x="96" y="32" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="11">POSTER &amp; SOCIAL ASSETS</text>
      <text x="96" y="48" fill="#a1a1aa" font-family="'Segoe UI', sans-serif" font-size="9">Modern Editorial Layouts</text>

      <rect x="96" y="60" width="135" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>
      <rect x="96" y="70" width="110" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>
      <rect x="96" y="80" width="80" height="6" rx="2" fill="rgba(255,255,255,0.2)"/>
    </g>
  </g>
</svg>
