<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="hero-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="card-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="600" height="380" rx="16" fill="url(#bg-grad-1)"/>
  
  <!-- Subtle Grid Accent -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="95" x2="600" y2="95"/>
    <line x1="0" y1="190" x2="600" y2="190"/>
    <line x1="0" y1="285" x2="600" y2="285"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
  </g>

  <!-- Laptop / Desktop Browser Mockup -->
  <g filter="url(#card-shadow)" transform="translate(45, 40)">
    <!-- Browser Window Frame -->
    <rect width="510" height="300" rx="10" fill="#131c31" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    <!-- Window Header -->
    <rect width="510" height="32" rx="10" fill="#18223c"/>
    <path d="M 0 22 H 510 V 32 H 0 Z" fill="#18223c"/>
    <!-- Browser dots -->
    <circle cx="20" cy="16" r="4.5" fill="#ef4444"/>
    <circle cx="36" cy="16" r="4.5" fill="#f59e0b"/>
    <circle cx="52" cy="16" r="4.5" fill="#10b981"/>
    <!-- URL bar -->
    <rect x="80" y="8" width="350" height="16" rx="8" fill="rgba(255,255,255,0.06)"/>
    <text x="255" y="20" fill="rgba(255,255,255,0.4)" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">https://agency-landing.modern.dev</text>

    <!-- Website Content Inside Browser -->
    <!-- Nav -->
    <rect x="25" y="46" width="60" height="12" rx="4" fill="url(#hero-grad-1)"/>
    <rect x="360" y="48" width="35" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
    <rect x="405" y="48" width="35" height="8" rx="4" fill="rgba(255,255,255,0.4)"/>
    <rect x="450" y="44" width="40" height="16" rx="8" fill="#6366f1"/>

    <!-- Hero Title & Subtitle -->
    <rect x="25" y="78" width="220" height="18" rx="4" fill="#ffffff"/>
    <rect x="25" y="104" width="180" height="12" rx="3" fill="rgba(255,255,255,0.6)"/>
    <rect x="25" y="122" width="150" height="8" rx="2" fill="rgba(255,255,255,0.3)"/>
    <rect x="25" y="134" width="130" height="8" rx="2" fill="rgba(255,255,255,0.3)"/>

    <!-- CTA Buttons -->
    <rect x="25" y="152" width="70" height="22" rx="6" fill="#6366f1"/>
    <rect x="105" y="152" width="65" height="22" rx="6" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.2)"/>

    <!-- Hero Graphic / Illustration right side -->
    <rect x="280" y="78" width="205" height="100" rx="8" fill="rgba(99,102,241,0.12)" stroke="rgba(99,102,241,0.3)"/>
    <circle cx="340" cy="128" r="28" fill="url(#hero-grad-1)" opacity="0.8"/>
    <rect x="390" y="105" width="75" height="10" rx="3" fill="#ffffff" opacity="0.8"/>
    <rect x="390" y="122" width="60" height="7" rx="2" fill="rgba(255,255,255,0.5)"/>
    <rect x="390" y="135" width="45" height="7" rx="2" fill="rgba(255,255,255,0.4)"/>

    <!-- 3 Feature Cards bottom -->
    <g transform="translate(25, 192)">
      <rect width="145" height="88" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="24" cy="24" r="10" fill="#6366f1" opacity="0.4"/>
      <rect x="16" y="44" width="80" height="9" rx="3" fill="#ffffff"/>
      <rect x="16" y="58" width="115" height="6" rx="2" fill="rgba(255,255,255,0.4)"/>
      <rect x="16" y="68" width="95" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
    </g>
    <g transform="translate(182, 192)">
      <rect width="145" height="88" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="24" cy="24" r="10" fill="#06b6d4" opacity="0.4"/>
      <rect x="16" y="44" width="80" height="9" rx="3" fill="#ffffff"/>
      <rect x="16" y="58" width="115" height="6" rx="2" fill="rgba(255,255,255,0.4)"/>
      <rect x="16" y="68" width="95" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
    </g>
    <g transform="translate(340, 192)">
      <rect width="145" height="88" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
      <circle cx="24" cy="24" r="10" fill="#ec4899" opacity="0.4"/>
      <rect x="16" y="44" width="80" height="9" rx="3" fill="#ffffff"/>
      <rect x="16" y="58" width="115" height="6" rx="2" fill="rgba(255,255,255,0.4)"/>
      <rect x="16" y="68" width="95" height="6" rx="2" fill="rgba(255,255,255,0.3)"/>
    </g>
  </g>
</svg>
